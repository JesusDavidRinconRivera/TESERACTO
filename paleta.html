<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paleta de Colores — TESERACTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0908;
      --paper: #F2F4F3;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--paper);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- Floating panels ---- */
    .panel {
      position: fixed;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: var(--paper);
    }

    .panel-left {
      top: 20px;
      left: 20px;
    }

    .panel-right {
      top: 20px;
      right: 20px;
    }

    .panel-bottom {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: row;
      align-items: center;
      gap: 16px;
      min-width: 380px;
    }

    .panel label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .panel input[type="color"] {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      background: none;
      padding: 2px;
    }

    .panel input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .panel input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }

    .blur-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .blur-row label {
      white-space: nowrap;
    }

    .blur-row input[type="range"] {
      flex: 1;
      min-width: 160px;
      accent-color: var(--paper);
      height: 4px;
    }

    .blur-val {
      font-size: 12px;
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .toggle-bg-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--paper);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .toggle-bg-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .light body,
    .light { background: #F2F4F3; color: #0A0908; }
    .light .panel { background: rgba(10, 9, 8, 0.08); border-color: rgba(10, 9, 8, 0.12); color: #0A0908; }
    .light .panel input[type="color"] { border-color: rgba(10, 9, 8, 0.2); }
    .light .toggle-bg-btn { background: rgba(10, 9, 8, 0.08); border-color: rgba(10, 9, 8, 0.2); color: #0A0908; }
    .light .toggle-bg-btn:hover { background: rgba(10, 9, 8, 0.16); border-color: rgba(10, 9, 8, 0.35); }

    /* ---- Grid de contenedores ---- */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 100px auto 140px;
      padding: 0 32px;
    }

    .card {
      aspect-ratio: 1;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card .num {
      font-family: 'Unbounded', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 4vw, 56px);
      user-select: none;
    }

    .card .info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.04em;
      opacity: 0.7;
      text-align: center;
      line-height: 1.5;
      user-select: all;
    }

    .card .copy-toast {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .card .copy-toast.show {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
      .panel-bottom { min-width: auto; width: calc(100% - 32px); flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="particles-js"></div>

<!-- Panel izquierdo: color de número -->
<div class="panel panel-left">
  <label>Color número</label>
  <input type="color" id="pickerText" value="#F2F4F3">
</div>

<!-- Panel derecho: color de contenedor -->
<div class="panel panel-right">
  <label>Color contenedor</label>
  <input type="color" id="pickerBg" value="#49111C">
</div>

<!-- Panel inferior: blur + toggle fondo -->
<div class="panel panel-bottom">
  <button class="toggle-bg-btn" id="toggleBg">Fondo: negro</button>
  <div class="blur-row">
    <label>Blur global</label>
    <input type="range" id="blurRange" min="0" max="40" value="0" step="1">
    <span class="blur-val" id="blurVal">0px</span>
  </div>
</div>

<!-- Grid de 10 cards -->
<div class="grid" id="grid"></div>

<!-- Particles.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
  particlesJS('particles-js', {
    particles: {
      number: { value: 50, density: { enable: true, value_area: 800 } },
      color: { value: '#595959' },
      shape: { type: 'circle' },
      opacity: { value: 1, random: true, anim: { enable: false } },
      size: { value: 12, random: true, anim: { enable: false } },
      line_linked: { enable: false },
      move: { enable: true, speed: 6, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
    },
    interactivity: {
      detect_on: 'canvas',
      events: { onhover: { enable: true, mode: 'bubble' }, onclick: { enable: true, mode: 'repulse' }, resize: true },
      modes: {
        bubble: { distance: 212, size: 10, duration: 2, opacity: 8, speed: 3 },
        repulse: { distance: 200, duration: 0.4 }
      }
    },
    retina_detect: true
  });
</script>

<script>
(function () {
  const COUNT = 10;
  const grid = document.getElementById('grid');
  const pickerText = document.getElementById('pickerText');
  const pickerBg = document.getElementById('pickerBg');
  const blurRange = document.getElementById('blurRange');
  const blurVal = document.getElementById('blurVal');

  /* ---- Helper: hex → hsl ---- */
  function hexToHSL(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; } else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
      const k = (n + h / 30) % 12;
      const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * color).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }

  /* ---- Crear contenedores ---- */
  const cards = [];
  for (let i = 1; i <= COUNT; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i;
    const info = document.createElement('span');
    info.className = 'info';
    const toast = document.createElement('span');
    toast.className = 'copy-toast';
    toast.textContent = 'copiado';
    card.appendChild(num);
    card.appendChild(info);
    card.appendChild(toast);
    grid.appendChild(card);
    cards.push({ el: card, numEl: num, infoEl: info, toastEl: toast, idx: i });
  }

  /* Saturation offsets: pre-computed so each card always has the same variation */
  const satOffsets = [];
  for (let i = 0; i < COUNT; i++) {
    satOffsets.push(Math.round((Math.sin(i * 2.7 + 0.3) * 0.5 + Math.cos(i * 1.3) * 0.5) * 20));
  }

  /* ---- Aplicar estilos ---- */
  function applyStyles() {
    const hex = pickerBg.value;
    const hsl = hexToHSL(hex);
    const textColor = pickerText.value;
    const blur = blurRange.value;
    blurVal.textContent = blur + 'px';

    cards.forEach((c, i) => {
      const t = (c.idx - 1) / (COUNT - 1);           /* 0 → 1 */

      /* Saturación: variabilidad fija por contenedor (±20%) */
      const sat = Math.max(0, Math.min(100, hsl.s + satOffsets[i]));

      /* Transparencia: 10% → 100% */
      const alpha = (0.10 + t * 0.90);
      const alphaPct = Math.round(alpha * 100);

      const bg = `hsla(${hsl.h}, ${sat}%, ${hsl.l}%, ${alpha})`;
      const hexAlpha = Math.round(alpha * 255).toString(16).padStart(2, '0');
      const cssColor = `background: ${bg};\nbackdrop-filter: blur(${blur}px);`;

      c.el.style.background = bg;
      c.el.style.backdropFilter = blur ? `blur(${blur}px)` : 'none';
      c.el.style.webkitBackdropFilter = blur ? `blur(${blur}px)` : 'none';
      c.numEl.style.color = textColor;
      c.infoEl.style.color = textColor;
      c.infoEl.textContent = `${hex}${hexAlpha} · ${alphaPct}% · blur ${blur}px`;
      c.cssValue = cssColor;
    });
  }

  /* ---- Eventos ---- */
  pickerText.addEventListener('input', applyStyles);
  pickerBg.addEventListener('input', applyStyles);
  blurRange.addEventListener('input', applyStyles);

  /* Click en card → copiar CSS al clipboard */
  cards.forEach(c => {
    c.el.addEventListener('click', function () {
      navigator.clipboard.writeText(c.cssValue).then(function () {
        c.toastEl.classList.add('show');
        setTimeout(function () { c.toastEl.classList.remove('show'); }, 1200);
      });
    });
  });

  /* Toggle fondo blanco / negro */
  var toggleBg = document.getElementById('toggleBg');
  var isLight = false;
  toggleBg.addEventListener('click', function () {
    isLight = !isLight;
    document.documentElement.classList.toggle('light', isLight);
    document.body.classList.toggle('light', isLight);
    toggleBg.textContent = isLight ? 'Fondo: blanco' : 'Fondo: negro';
  });

  applyStyles();
})();
</script>

</body>
</html>
