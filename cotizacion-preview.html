<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESERACTO — Solicita tu cotización (vista previa)</title>
<style>
/* ============================================================
   TESERACTO — Bloque "Solicita tu cotización"
   Solo estiliza .contact-form y su interior (#quiz).
   No se modifica HTML ni JS. Los id / data-* / clases usados
   por js/forms/quiz.js se respetan tal cual.
   ============================================================ */

/* ------------------------------------------------------------
   1. TOKENS — paleta oficial (no se inventan colores nuevos)
   ------------------------------------------------------------ */
:root{
  --void:        #0A0908;
  --void-2:      #15120F;
  --maroon:      #0e3a8b;
  --maroon-2:    #154bc2;
  --ember:       #d0d0d0;
  --paper:       #F2F4F3;
  --mist:        #A9A3A0;
  --hair-d:      rgba(242,244,243,0.14);
  --hair-d2:     rgba(242,244,243,0.30);
  --radius-lg:   32px;
  --radius-md:   18px;
  --radius-pill: 999px;
  --glass-bg:     rgba(255,255,255,0.45);
  --glass-border: rgba(255,255,255,0.3);

  /* tokens derivados solo para este bloque (mismos colores base) */
  --qz-maroon-glow: rgba(14,58,139,0.35);
  --qz-danger:      #E6533C; /* variante de alerta sobre --ember, únicamente para error */
  --qz-success:     #3FAE6B;
  --qz-ease:         cubic-bezier(.65,0,.35,1);
}

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

/* ------------------------------------------------------------
   2. .contact-form — panel "glass" oscuro
   ------------------------------------------------------------ */
.contact-form{
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 56px 40px 52px;
  background:
    linear-gradient(180deg, rgba(242,244,243,0.05), rgba(242,244,243,0.02)),
    var(--void-2);
  border: 1px solid var(--hair-d);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  font-family: 'Inter', sans-serif;
  color: var(--paper);
  overflow: hidden;
}

/* resplandor sutil de fondo, quieto — un único acento, no decoración repetida */
.contact-form::before{
  content: "";
  position: absolute;
  top: -120px;
  right: -100px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, var(--qz-maroon-glow), transparent 70%);
  pointer-events: none;
}

.contact-form > h2,
.contact-form > h3{
  position: relative;
  text-align: center;
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  font-size: clamp(1.4rem, 1.1rem + 1vw, 1.9rem);
  line-height: 1.25;
  color: var(--paper);
  margin: 0;
}

/* ------------------------------------------------------------
   3. #quiz — contenedor del cuestionario
   ------------------------------------------------------------ */
#quiz{
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 24px;
  /* #quiz se extiende hasta #quizProgress: el viewport queda arriba,
     luego 10px de separación, el progreso y 10px de padding bajo él */
  padding-bottom: 28px;
}

/* ------------------------------------------------------------
   4. #quizProgress y .pip — progreso de pasos
   ------------------------------------------------------------ */
#quizProgress{
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 4;
}

.pip{
  --pip-size: 8px;
  position: relative;
  width: var(--pip-size);
  height: var(--pip-size);
  border-radius: var(--radius-pill);
  background: var(--hair-d2);
  transition: width .35s var(--qz-ease), background .35s ease, box-shadow .35s ease;
}

/* paso actual: se alarga en vez de solo cambiar de color, marca dirección de avance */
.pip.is-current{
  width: 26px;
  background: var(--maroon-2);
  box-shadow: 0 0 0 4px var(--qz-maroon-glow);
}

.pip.is-done{
  background: var(--paper);
  opacity: .7;
}

/* ------------------------------------------------------------
   5. #quizViewport y .quiz-step — carrusel de pasos
   ------------------------------------------------------------ */
#quizViewport{
  position: relative;
  overflow-x: hidden;
  overflow-y: hidden; /* corte horizontal del carrusel; el alto lo garantiza min-height (sin barra) */
  min-height: 330px;
}

.quiz-step{
  display: none;
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transform: translateX(0);
  transition: transform .5s var(--qz-ease), opacity .4s ease;
  pointer-events: none;
}

/* paso activo: ocupa exactamente el tamaño de #quizViewport y centra
   su contenido (pregunta + botones) verticalmente para no desbordarse */
.quiz-step.is-active{
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  position: absolute;
  inset: 0;
  opacity: 1;
  visibility: visible;
  transform: translateX(0);
  pointer-events: auto;
}

/* punto de partida de un paso que ENTRA (sin transición, salto instantáneo) */
.quiz-step.is-from-right{
  display: block;
  visibility: visible;
  position: absolute;
  transform: translateX(48px);
  opacity: 0;
  transition: none;
}
.quiz-step.is-from-left{
  display: block;
  visibility: visible;
  position: absolute;
  transform: translateX(-48px);
  opacity: 0;
  transition: none;
}

/* punto de llegada de un paso que SALE (con transición) */
.quiz-step.is-to-right{
  display: block;
  visibility: visible;
  position: absolute;
  transform: translateX(48px);
  opacity: 0;
  transition: transform .45s var(--qz-ease), opacity .35s ease;
  pointer-events: none;
}
.quiz-step.is-to-left{
  display: block;
  visibility: visible;
  position: absolute;
  transform: translateX(-48px);
  opacity: 0;
  transition: transform .45s var(--qz-ease), opacity .35s ease;
  pointer-events: none;
}

/* cuando is-active coincide con is-from-*, gana el estado final (0 / opacity 1) */
.quiz-step.is-from-right.is-active,
.quiz-step.is-from-left.is-active{
  transform: translateX(0);
  opacity: 1;
  transition: transform .5s var(--qz-ease), opacity .4s ease;
}

.quiz-step > .quiz-back + *{
  margin-top: 0;
}

/* ------------------------------------------------------------
   6. .quiz-back — volver
   ------------------------------------------------------------ */
/* .quiz-back ahora es un elemento FIJO y ESTÁTICO, hermano de
   #quiz (no anidado dentro de los .quiz-step que se deslizan), para
   que no se mueva ni parpadee con la transición del carrusel. Se
   posiciona literalmente en la esquina superior derecha de
   .contact-form, a la misma altura que el título. Solo cambia de
   visibilidad (sin transición) según el paso — nunca se anima. */
.quiz-back{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: absolute;
  top: 0;
  right: 0;
  margin: 0;
  padding: 12px 20px 12px 16px;
  background: rgba(242,244,243,0.05);
  border: 1px solid var(--hair-d);
  border-top: none;
  border-right: none;
  border-radius: 0 var(--radius-lg) 0 var(--radius-md);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--mist);
  cursor: pointer;
  z-index: 6;
}

.quiz-back[hidden]{
  display: none;
}

.quiz-back:hover{
  color: var(--paper);
  background: rgba(21,75,194,0.14);
}

.quiz-back:focus-visible{
  outline: 2px solid var(--maroon-2);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ------------------------------------------------------------
   7. .quiz-q — enunciado de la pregunta
   ------------------------------------------------------------ */
.quiz-q{
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
  line-height: 1.35;
  color: var(--paper);
  text-align: center;
  margin: 0 auto 20px;
  max-width: 34ch;
}

/* el título fijo del paso 1 usa el mismo tratamiento tipográfico */
.quiz-step[data-step="1"] > p,
.quiz-step[data-step="1"] > .quiz-q{
  font-family: 'Unbounded', sans-serif;
  font-weight: 600;
  font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
  line-height: 1.35;
  color: var(--paper);
  text-align: center;
  margin: 0 auto 20px;
  max-width: 34ch;
}

/* ------------------------------------------------------------
   8. .quiz-opts / .quiz-opt — opciones de respuesta
   ------------------------------------------------------------ */
.quiz-opts{
  display: grid;
  width: 100%;
  gap: 10px;
  /* el contenedor de los botones se estira hacia abajo y los botones
     llenan su área: cada fila reparte el alto disponible */
  align-content: stretch;
  grid-auto-rows: 1fr;
  min-height: 280px;
}

.quiz-opts[data-cols="2"]{
  grid-template-columns: repeat(2, 1fr);
}

.quiz-opt{
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  height: 100%; /* el botón llena su celda (tamaño anclado al quiz) */
  padding: 16px 18px;
  background: rgba(242,244,243,0.03);
  border: 1px solid var(--hair-d);
  border-radius: var(--radius-md);
  overflow: hidden; /* asegura que el borde externo quede siempre redondeado, sin fugas de fondo */
  font-family: 'Inter', sans-serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
}

.quiz-opt:hover{
  border-color: var(--maroon-2);
  background: rgba(21,75,194,0.12);
  transform: translateY(-2px);
}

.quiz-opt:active{
  transform: translateY(0);
}

.quiz-opt:focus-visible{
  outline: 2px solid var(--maroon-2);
  outline-offset: 2px;
}

.quiz-opt.is-selected{
  border-color: var(--maroon);
  background: rgba(14,58,139,0.22);
  box-shadow: 0 0 0 1px var(--maroon-2) inset;
}

.quiz-opt:disabled,
.quiz-opt[disabled]{
  opacity: .45;
  cursor: not-allowed;
  transform: none;
}

/* paso 4: reunión virtual / presencial — mismas .quiz-opt, layout de 2 columnas por defecto ya cubierto por [data-cols] cuando exista; si el HTML no trae data-cols en el paso 4, se mantiene en fila por herencia de .quiz-opts */
.quiz-step[data-step="4"] .quiz-opts{
  grid-template-columns: repeat(2, 1fr);
  width: 100%;
  gap: 5px;
}

/* ------------------------------------------------------------
   9. .field / #contactEmail — paso 5
   ------------------------------------------------------------ */
.field{
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}

#contactEmail{
  padding: 15px 18px;
  background: rgba(242,244,243,0.04);
  border: 1px solid var(--hair-d2);
  border-radius: var(--radius-md);
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  color: var(--paper);
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

#contactEmail::placeholder{
  color: var(--mist);
}

#contactEmail:hover{
  border-color: var(--hair-d2);
  background: rgba(242,244,243,0.06);
}

#contactEmail:focus{
  outline: none;
  border-color: var(--maroon-2);
  box-shadow: 0 0 0 3px var(--qz-maroon-glow);
}

#contactEmail:invalid:not(:placeholder-shown){
  border-color: var(--qz-danger);
}

/* ------------------------------------------------------------
   10. .submit-btn — envío + estado de carga
   ------------------------------------------------------------ */
.submit-btn{
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  background: var(--maroon);
  border: 1px solid var(--maroon);
  border-radius: var(--radius-pill);
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}

.submit-btn:hover{
  background: var(--maroon-2);
  border-color: var(--maroon-2);
  box-shadow: 0 10px 28px -10px var(--qz-maroon-glow);
}

.submit-btn:active{
  transform: translateY(1px);
}

.submit-btn:focus-visible{
  outline: 2px solid var(--paper);
  outline-offset: 3px;
}

.submit-btn:disabled{
  opacity: .55;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* estado de carga: texto atenuado + spinner */
.submit-btn.btn--loading{
  color: transparent;
  pointer-events: none;
}

.submit-btn.btn--loading::after{
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(242,244,243,0.35);
  border-top-color: var(--paper);
  animation: qz-spin .7s linear infinite;
}

@keyframes qz-spin{
  to{ transform: rotate(360deg); }
}

/* ------------------------------------------------------------
   11. .form-note — feedback bajo el formulario
   ------------------------------------------------------------ */
.form-note{
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 20px;
  margin: 14px 0 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--mist);
  transition: color .2s ease;
}

.form-note--loading{
  color: var(--maroon-2);
}

.form-note--loading::before{
  content: "";
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--maroon-2);
  animation: qz-pulse 1s ease-in-out infinite;
}

.form-note--success{
  color: var(--qz-success);
}

.form-note--success::before{
  content: "";
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--qz-success);
}

.form-note--error{
  color: var(--qz-danger);
}

.form-note--error::before{
  content: "";
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--qz-danger);
}

@keyframes qz-pulse{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}

/* ------------------------------------------------------------
   12. Responsive
   ------------------------------------------------------------ */
@media (max-width: 768px){
  /* red de seguridad: si .contact-grid no colapsa ya en otra hoja de
     estilos, aquí se asegura 1 columna sin tocar .contact-info */
  .contact-grid{
    grid-template-columns: 1fr;
  }

  .contact-form{
    padding: 52px 24px 48px;
    gap: 22px;
  }

  .quiz-back{
    padding: 10px 16px 10px 12px;
    font-size: 0.78rem;
  }

  #quizViewport{
    min-height: 350px;
  }
}

@media (max-width: 560px){
  .quiz-opts[data-cols="2"],
  .quiz-step[data-step="4"] .quiz-opts{
    grid-template-columns: 1fr;
  }

  .contact-form{
    padding: 46px 18px 44px;
    border-radius: var(--radius-md);
  }

  .quiz-opt{
    padding: 14px 16px;
  }
}

/* ------------------------------------------------------------
   13. Accesibilidad — respeto a prefers-reduced-motion
   ------------------------------------------------------------ */
@media (prefers-reduced-motion: reduce){
  .quiz-step,
  .quiz-opt,
  .submit-btn,
  .pip,
  .quiz-back{
    transition: none !important;
    animation: none !important;
  }
}

/* ============================================================
   SOLO PARA VISTA PREVIA — no es parte del entregable.
   Contenedor de página para ver .contact-form aislado.
   ============================================================ */

*{ box-sizing: border-box; }

body{
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  background: var(--void);
  font-family: 'Inter', sans-serif;

</style>
</head>
<body>

<div class="page-wrap">
  <p class="page-eyebrow">Vista previa — bloque de contacto</p>

  <section>

    <!-- .contact-form: ESTE es el bloque del entregable -->
    <div class="contact-form">
      <h3>Solicita tu cotización</h3>

      <div id="quiz">
        <button type="button" class="quiz-back" id="quizBackBtn" hidden>← Volver</button>

        <div id="quizProgress">
          <span class="pip" data-step="1"></span>
          <span class="pip" data-step="2"></span>
          <span class="pip" data-step="3"></span>
          <span class="pip" data-step="4"></span>
          <span class="pip" data-step="5"></span>
        </div>

        <div id="quizViewport">

          <section class="quiz-step is-active" data-step="1">
            <p>¿Qué quieres lograr en tu empresa?</p>
            <div class="quiz-opts" data-cols="2" id="opts1"></div>
          </section>

          <section class="quiz-step" data-step="2">
            <div class="quiz-q" id="q2"></div>
            <div class="quiz-opts" data-cols="2" id="opts2"></div>
          </section>

          <section class="quiz-step" data-step="3">
            <div class="quiz-q" id="q3"></div>
            <div class="quiz-opts" data-cols="2" id="opts3"></div>
          </section>

          <section class="quiz-step" data-step="4">
            <div class="quiz-q">¿Prefieres reunión virtual o presencial?</div>
            <div class="quiz-opts" data-cols="2">
              <button class="quiz-opt" data-value="virtual">Reunión virtual</button>
              <button class="quiz-opt" data-value="presencial">Reunión presencial</button>
            </div>
          </section>

          <section class="quiz-step" data-step="5">
            <div class="quiz-q">¿A qué correo te contactamos?</div>
            <div class="field">
              <input id="contactEmail" type="email" autocomplete="email" placeholder="tucorreo@empresa.com">
            </div>
            <button type="button" class="submit-btn" id="sendMailBtn">Enviar solicitud</button>
            <p class="form-note" id="quizNote">Al enviar, TESERACTO te responde con una propuesta concreta.</p>
          </section>

        </div>
      </div>
    </div>

  </section>
</div>

<script>
/* ============================================================
   DEMO / VISTA PREVIA de js/forms/quiz.js
   Este archivo NO es el entregable — el JS real del sitio ya
   existe y no se toca. Esta es una implementación mínima solo
   para poder ver el CSS funcionando con el carrusel real.
   ============================================================ */
(function () {
  const BRANCHES = {
    'ahorrar-dinero': {
      q2: '¿Dónde sientes que pierdes dinero hoy?',
      opts2: ['Procesos manuales', 'Herramientas duplicadas', 'Errores operativos', 'Soporte externo caro'],
      q3: '¿Con qué frecuencia ocurren esos gastos?',
      opts3: ['Todos los días', 'Cada semana', 'Cada mes', 'Ocasionalmente'],
    },
    'ganar-dinero': {
      q2: '¿Qué evita que ganes más dinero?',
      opts2: ['Falta de automatización', 'Procesos lentos de venta', 'Sin plataforma digital', 'Datos dispersos'],
      q3: '¿Qué tan urgente es resolverlo?',
      opts3: ['Es urgente', 'En los próximos meses', 'Este semestre', 'Aún explorando'],
    },
    'crear-app': {
      q2: '¿Qué idea quieres construir?',
      opts2: ['App para clientes', 'Sistema interno', 'Plataforma web', 'Integración entre sistemas'],
      q3: '¿Qué tan pronto necesitas tenerla lista?',
      opts3: ['Lo antes posible', 'En 1-3 meses', 'Este año', 'Sin fecha definida'],
    },
    'ahorrar-tiempo': {
      q2: '¿Qué te quita más tiempo a tu equipo?',
      opts2: ['Tareas repetitivas', 'Reportes manuales', 'Coordinación entre áreas', 'Soporte técnico'],
      q3: '¿Cuántas horas semanales estimas que se pierden?',
      opts3: ['Menos de 5', 'Entre 5 y 15', 'Entre 15 y 30', 'Más de 30'],
    },
  };

  const STEP1_OPTIONS = [
    { label: 'Ahorrar dinero', branch: 'ahorrar-dinero' },
    { label: 'Ganar dinero', branch: 'ganar-dinero' },
    { label: 'Quiero crear una aplicación', branch: 'crear-app' },
    { label: 'Ahorrar tiempo', branch: 'ahorrar-tiempo' },
  ];

  const viewport = document.getElementById('quizViewport');
  const progress = document.getElementById('quizProgress');
  const pips = Array.from(progress.querySelectorAll('.pip'));
  const steps = Array.from(viewport.querySelectorAll('.quiz-step'));
  const opts1 = document.getElementById('opts1');
  const q2 = document.getElementById('q2');
  const opts2 = document.getElementById('opts2');
  const q3 = document.getElementById('q3');
  const opts3 = document.getElementById('opts3');
  const emailInput = document.getElementById('contactEmail');
  const sendBtn = document.getElementById('sendMailBtn');
  const note = document.getElementById('quizNote');
  const backBtn = document.getElementById('quizBackBtn');

  const state = { step: 1, branch: null, a2: null, a3: null, a4: null };

  function stepEl(n) {
    return steps.find((s) => s.dataset.step === String(n));
  }

  function updatePips() {
    pips.forEach((pip) => {
      const n = Number(pip.dataset.step);
      pip.classList.toggle('is-current', n === state.step);
      pip.classList.toggle('is-done', n < state.step);
    });
  }

  // El botón "Volver" es un único elemento fijo: solo se
  // muestra/oculta al instante (sin transición), nunca se
  // inserta ni se destruye, así que no se mueve con el carrusel.
  backBtn.addEventListener('click', () => goTo(state.step - 1, 'back'));
  function updateBackButton() {
    backBtn.hidden = state.step === 1;
  }

  function goTo(n, dir) {
    const current = stepEl(state.step);
    const next = stepEl(n);
    if (!next || next === current) return;

    if (dir === 'forward') {
      current.classList.remove('is-active');
      current.classList.add('is-to-left');
      next.classList.add('is-from-right');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add('is-active');
          next.classList.remove('is-from-right');
        });
      });
    } else {
      current.classList.remove('is-active');
      current.classList.add('is-to-right');
      next.classList.add('is-from-left');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add('is-active');
          next.classList.remove('is-from-left');
        });
      });
    }

    setTimeout(() => {
      current.classList.remove('is-to-left', 'is-to-right');
    }, 520);

    state.step = n;
    updatePips();
    updateBackButton();
  }

  function makeOptButton(label, attrs, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quiz-opt';
    btn.textContent = label;
    Object.entries(attrs || {}).forEach(([k, v]) => btn.setAttribute(k, v));
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('.quiz-opt').forEach((b) => b.classList.remove('is-selected'));
      btn.classList.add('is-selected');
      onClick(btn);
    });
    return btn;
  }

  // Paso 1
  STEP1_OPTIONS.forEach((opt) => {
    const btn = makeOptButton(opt.label, { 'data-branch': opt.branch }, () => {
      state.branch = opt.branch;
      buildStep2();
      setTimeout(() => goTo(2, 'forward'), 180);
    });
    opts1.appendChild(btn);
  });

  function buildStep2() {
    const b = BRANCHES[state.branch];
    q2.textContent = b.q2;
    opts2.innerHTML = '';
    b.opts2.forEach((label) => {
      const btn = makeOptButton(label, { 'data-a2': '', 'data-label': label }, () => {
        state.a2 = label;
        buildStep3();
        setTimeout(() => goTo(3, 'forward'), 180);
      });
      opts2.appendChild(btn);
    });
  }

  function buildStep3() {
    const b = BRANCHES[state.branch];
    q3.textContent = b.q3;
    opts3.innerHTML = '';
    b.opts3.forEach((label) => {
      const btn = makeOptButton(label, { 'data-a3': '', 'data-label': label }, () => {
        state.a3 = label;
        setTimeout(() => goTo(4, 'forward'), 180);
      });
      opts3.appendChild(btn);
    });
  }

  // Paso 4
  document.querySelectorAll('.quiz-step[data-step="4"] .quiz-opt').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.quiz-step[data-step="4"] .quiz-opt').forEach((b) => b.classList.remove('is-selected'));
      btn.classList.add('is-selected');
      state.a4 = btn.dataset.value;
      setTimeout(() => goTo(5, 'forward'), 180);
    });
  });

  // Paso 5
  sendBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!valid) {
      note.className = 'form-note form-note--error';
      note.textContent = 'Ingresa un correo válido para continuar.';
      emailInput.focus();
      return;
    }
    sendBtn.classList.add('btn--loading');
    sendBtn.disabled = true;
    note.className = 'form-note form-note--loading';
    note.textContent = 'Enviando tu solicitud…';

    setTimeout(() => {
      sendBtn.classList.remove('btn--loading');
      sendBtn.disabled = false;
      note.className = 'form-note form-note--success';
      note.textContent = '¡Listo! Te contactaremos muy pronto a ' + email + '.';
    }, 1400);
  });

  updatePips();
  updateBackButton();
})();

</script>
</body>
</html>
