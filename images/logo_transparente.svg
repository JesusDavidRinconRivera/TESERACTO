<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo blanco con esquinas redondeadas de 50px -->
  <rect x="0" y="0" width="512" height="512" rx="50" ry="50" fill="#FFFFFF"/>

  <!-- Líneas principales del cubo exterior -->
  <g fill="none" stroke="#000000" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="256,40 440,146 440,358 256,464 72,358 72,146" />
    <line x1="256" y1="464" x2="256" y2="256" />
    <line x1="72" y1="146" x2="256" y2="256" />
    <line x1="440" y1="146" x2="256" y2="256" />
  </g>

  <!-- Marco/Hueco central (Borde negro, Máscara blanca) -->
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="#FFFFFF" stroke="#000000" stroke-width="32" stroke-linejoin="round"/>

  <!-- Cubo interior -->
  <g>
    <!-- Cara Superior -->
    <polygon points="256,194 300,219 256,244 212,219" fill="#000000"/>
    <!-- Cara Izquierda -->
    <polygon points="212,219 256,244 256,294 212,269" fill="#000000"/>
    <!-- Cara Derecha -->
    <polygon points="256,244 300,219 300,269 256,294" fill="#000000"/>
  </g>

  <!-- Líneas blancas de separación del cubo interior -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="256,194 300,219 300,269 256,294 212,269 212,219" />
    <line x1="256" y1="294" x2="256" y2="244" />
    <line x1="212" y1="219" x2="256" y2="244" />
    <line x1="300" y1="219" x2="256" y2="244" />
  </g>
</svg>
